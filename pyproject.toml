[project]
name = "agentscan"
version = "0.1.0"
description = "Read-only crawler that classifies AWS workloads as AI agents, LLM apps or plain services"
authors = [
    { name = "prashilthul", email = "prashil1411@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.14.0",
    "boto3>=1.44.11",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "typer>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[server]>=5.2.6",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
agentscan = "agentscan.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
